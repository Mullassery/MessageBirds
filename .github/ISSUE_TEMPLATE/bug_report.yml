name: Bug report
description: Report something that's broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please **do not** use this form for security vulnerabilities —
        see [SECURITY.md](https://github.com/Mullassery/MessageBirds/blob/main/SECURITY.md)
        instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repo is affected?
      options:
        - crates/ (Rust workspace — specify which crate below)
        - sdk/js
        - sdk/web
        - sdk/python
        - sdk/ios
        - sdk/android
        - edge/ingest-gateway
        - ui/
        - docs
        - CI / build
        - other
    validations:
      required: true
  - type: input
    id: crate-or-detail
    attributes:
      label: Specific crate/package (if applicable)
      placeholder: e.g. crates/journeys, sdk/python
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include exact commands run (e.g. `cargo test -p mb-journeys`, `npm run test --workspace=sdk/web`).
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust/Node/Python/Swift version, whether you were running against docker-compose or something else.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
