name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install librdkafka build dependencies
        # rdkafka-sys's cmake-build compiles librdkafka from its vendored
        # C sources, and librdkafka's own CMake config requires curl.h
        # unconditionally (for OAUTHBEARER/OIDC support) regardless of
        # which Rust-level features are enabled. ubuntu-latest runners
        # don't ship it by default. This was already broken pre-Phase-6 —
        # not something this session introduced — but the new CI badge
        # makes it visible, so fixing it now.
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  js:
    name: JS (SDK/web/gateway typecheck+test, UI typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm install (workspaces)
        run: npm install

      - name: sdk/js build (tsc)
        run: npm run build --workspace=sdk/js

      - name: sdk/web typecheck + test
        run: |
          npm exec --workspace=sdk/web -- tsc --noEmit
          npm run test --workspace=sdk/web

      - name: edge/ingest-gateway typecheck + test
        run: |
          npm run typecheck --workspace=edge/ingest-gateway
          npm run test --workspace=edge/ingest-gateway

      - name: UI typecheck
        run: npm exec --workspace=ui -- tsc --noEmit

      - name: UI build
        run: npm run build --workspace=ui

  python-sdk:
    name: sdk/python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install sdk/python (editable, dev extras)
        run: pip install -e "./sdk/python[dev]"

      - name: pytest
        run: pytest sdk/python

  ios-sdk:
    name: sdk/ios (swift build + test)
    # Needs a real macOS runner with full Xcode — this is exactly the
    # environment that wasn't available when sdk/ios was written (only
    # Command Line Tools, no XCTest/swift-testing), so this job is what
    # actually exercises Tests/MessageBirdsAnalyticsTests for the first
    # time, not a redundant check.
    runs-on: macos-15
    defaults:
      run:
        working-directory: sdk/ios
    steps:
      - uses: actions/checkout@v4

      # macos-15's default-selected Xcode doesn't always bundle the
      # Testing module (Tests/MessageBirdsAnalyticsTests uses
      # `import Testing`, not XCTest) — pin explicitly rather than
      # depend on whichever Xcode happens to be pre-selected.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: swift build
        run: swift build

      - name: swift test
        run: swift test

      - name: swift run mb-verify
        run: swift run mb-verify

  # sdk/android is intentionally not built in CI yet — it was written
  # without access to gradle/kotlinc/the Android SDK and hasn't been
  # compiled anywhere. Wiring up android-actions/setup-android is real
  # future work, not done here alongside a doc-only change, so this stays
  # a disclosed gap (see docs/ARCHITECTURE.md) rather than a quiet claim
  # of coverage.
