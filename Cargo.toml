[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/namespaces",
    "crates/schema-registry",
    "crates/mixins",
    "crates/identity",
    "crates/merge-policy",
    "crates/profile",
    "crates/events",
    "crates/audiences",
    "crates/connectors",
    "crates/governance",
    "crates/channels",
    "crates/templates",
    "crates/journeys",
    "crates/api",
    "crates/worker",
    "crates/journeys-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/MessageBirds"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8.1", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
axum = "0.7"
rdkafka = { version = "0.39", features = ["cmake-build"] }

mb-core = { path = "crates/core" }
mb-namespaces = { path = "crates/namespaces" }
mb-schema-registry = { path = "crates/schema-registry" }
mb-mixins = { path = "crates/mixins" }
mb-identity = { path = "crates/identity" }
mb-merge-policy = { path = "crates/merge-policy" }
mb-profile = { path = "crates/profile" }
mb-events = { path = "crates/events" }
mb-audiences = { path = "crates/audiences" }
mb-connectors = { path = "crates/connectors" }
mb-governance = { path = "crates/governance" }
mb-channels = { path = "crates/channels" }
mb-templates = { path = "crates/templates" }
mb-journeys = { path = "crates/journeys" }
