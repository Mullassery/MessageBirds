[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/net-guard",
    "crates/namespaces",
    "crates/schema-registry",
    "crates/mixins",
    "crates/identity",
    "crates/merge-policy",
    "crates/profile",
    "crates/events",
    "crates/audiences",
    "crates/connectors",
    "crates/governance",
    "crates/channels",
    "crates/templates",
    "crates/journeys",
    "crates/api",
    "crates/worker",
    "crates/journeys-worker",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/PyCustomerHub"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8.1", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate"] }
axum = "0.7"
rdkafka = { version = "0.36", features = ["cmake-build"] }

pch-core = { path = "crates/core" }
pch-namespaces = { path = "crates/namespaces" }
pch-schema-registry = { path = "crates/schema-registry" }
pch-mixins = { path = "crates/mixins" }
pch-identity = { path = "crates/identity" }
pch-merge-policy = { path = "crates/merge-policy" }
pch-profile = { path = "crates/profile" }
pch-events = { path = "crates/events" }
pch-audiences = { path = "crates/audiences" }
pch-connectors = { path = "crates/connectors" }
pch-governance = { path = "crates/governance" }
pch-channels = { path = "crates/channels" }
pch-templates = { path = "crates/templates" }
pch-journeys = { path = "crates/journeys" }
